version: '3.8'

services:
  # 1. 数据库服务 MySQL 8.0
  starlink-mysql:
    image: mysql:8.0
    container_name: starlink-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: starlink_campus
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 移除错误的 schema 挂载，统一由 Spring Boot Flyway 进行初始化
      # - ../sql/01_schema_kindergarten.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - starlink-net

  # 2. 缓存服务 Redis 7.0
  starlink-redis:
    image: redis:7.0-alpine
    container_name: starlink-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - starlink-net

  # 3. 文件存储服务 MinIO
  starlink-minio:
    image: minio/minio:latest
    container_name: starlink-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minio_password_123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - starlink-net

  # 4. 私有化人脸识别服务 CompreFace
  compreface-api:
    image: exadel/compreface-api:1.2.0
    container_name: compreface-api
    restart: always
    environment:
      - DB_URL=jdbc:postgresql://compreface-postgres:5432/compreface
      - DB_USER=postgres
      - DB_PASSWORD=compreface_pass
    ports:
      - "8000:8000"
    depends_on:
      - compreface-postgres
    networks:
      - starlink-net

  compreface-postgres:
    image: postgres:15-alpine
    container_name: compreface-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=compreface_pass
      - POSTGRES_DB=compreface
    networks:
      - starlink-net

volumes:
  mysql-data:
  minio-data:

networks:
  starlink-net:
    driver: bridge
