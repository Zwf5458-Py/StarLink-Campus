server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: starlink-campus-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/starlink_campus?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123456}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.starlink.campus.module.kindergarten.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 2
      logic-not-delete-value: 0

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

kindergarten:
  face-service-url: http://localhost:8000/api/v1/recognition/recognize
  temp-warning-threshold: 37.3

starlink:
  refund:
    absent-threshold: 5
    daily-amount: 20
  ai:
    gateway:
      mock: true
      endpoint: "https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation"
      api-key: "sk-mock-key"
